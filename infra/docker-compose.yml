# Local data stores only. Values come from repo-root `.env`.
# Do not put secrets or ports in this file.
#
#   ./scripts/dev-up.sh

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vroometr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      UNLEASH_DATABASE_NAME: ${UNLEASH_DATABASE_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: vroometr-redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.4
    container_name: vroometr-localstack
    ports:
      - "${LOCALSTACK_PORT}:4566"
    environment:
      SERVICES: s3
      DEBUG: "0"
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  unleash:
    image: unleashorg/unleash-server:6
    container_name: vroometr-unleash
    environment:
      DATABASE_HOST: ${UNLEASH_DATABASE_HOST}
      DATABASE_PORT: ${UNLEASH_DATABASE_PORT}
      DATABASE_NAME: ${UNLEASH_DATABASE_NAME}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      INIT_CLIENT_API_TOKENS: ${UNLEASH_API_TOKEN}
      UNLEASH_DEFAULT_ADMIN_PASSWORD: ${UNLEASH_ADMIN_PASSWORD}
    ports:
      - "${UNLEASH_PORT}:4242"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4242/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  localstack_data:
