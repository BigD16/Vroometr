[project]
name = "vroometr"
version = "0.1.0"
description = "Motorcycle and dirt-bike ownership platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["libs", "services", "pipelines", "workers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["libs"]
testpaths = ["tests"]
